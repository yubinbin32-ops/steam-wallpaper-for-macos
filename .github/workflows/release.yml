name: Release Steam Wallpaper for Mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Package Wallpaper.app
        run: |
          chmod +x bundle.sh run.sh
          ./bundle.sh

      - name: Compress to ZIP Archive
        run: |
          ditto -c -k --keepParent Wallpaper.app SteamWallpaper-macOS.zip
          shasum -a 256 SteamWallpaper-macOS.zip > SteamWallpaper-macOS.zip.sha256
          echo "SHA256 Checksum:"
          cat SteamWallpaper-macOS.zip.sha256

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Steam Wallpaper for Mac ${{ github.ref_name || github.event.inputs.tag }}
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            SteamWallpaper-macOS.zip
            SteamWallpaper-macOS.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
